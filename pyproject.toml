[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-rec"
version = "0.1.0"
description = "Multi-modal restaurant recommendation system (text + image + structured late fusion)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = ["matplotlib>=3.8", "jupyter"]
dev = ["pytest>=8.0"]

[project.scripts]
restaurant-rec = "restaurant_rec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
